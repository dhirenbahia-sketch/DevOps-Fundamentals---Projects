name: CI pipeline

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r cicd-assignment-1/requirements.txt
                pip install pytest flake8

            - name: Lint
              run: flake8 ./cicd-assignment-1 --max-line-length=100

            - name: Run tests
              run: pytest ./cicd-assignment-1

            - name: Docker build check
              run: docker build -t myapp ./cicd-assignment-1

    deploy:
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to EC2
              env:
                EC2_HOST: ${{ secrets.EC2_HOST }}
                EC2_USER: ${{ secrets.EC2_USER }}
                EC2_KEY: ${{ secrets.EC2_SSH_KEY }}

              run: |
                mkdir -p ~/.ssh
                printf "%s\n" "$EC2_KEY" > ~/.ssh/id_rsa
                chmod 600 ~/.ssh/id_rsa

                ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

                ssh -i ~/.ssh/ec2_key $EC2_USER@$EC2_HOST << 'EOF'
                  cd /home/ec2-user/DevOps-Fundamentals---Projects/cicd-assignment-1

                  git pull origin main

                  sudo docker build -t myapp .

                  sudo docker stop myapp || true
                  sudo docker rm myapp || true

                  sudo docker run -d --name myapp --restart unless-stopped -p 80:5002 myapp
                EOF



            
                