name: CI pipeline

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r cicd-assignment-1/requirements.txt
                pip install pytest flake8

            - name: Lint
              run: flake8 ./cicd-assignment-1 --max-line-length=100

            - name: Run tests
              run: pytest ./cicd-assignment-1

            - name: Docker build check
              run: docker build -t myapp ./cicd-assignment-1

    deploy:
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to EC2
              env:
                EC2_HOST: ${{ secrets.EC2_HOST }}
                EC2_USER: ${{ secrets.EC2_USER }}
                EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}

              
              run: |
                run: |
                set -e

                mkdir -p "$HOME/.ssh"

                printf '%s' "$EC2_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/ec2_key"
                chmod 600 "$HOME/.ssh/ec2_key"

                ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

                ssh -i "$HOME/.ssh/ec2_key" "$EC2_USER@$EC2_HOST" << 'EOF'
                  cd /home/ec2-user/DevOps-Fundamentals---Projects/cicd-assignment-1

                  git pull origin main

                  sudo docker build -t myapp .

                  sudo docker stop myapp || true
                  sudo docker rm myapp || true

                  sudo docker run -d --name myapp --restart unless-stopped -p 80:5002 myapp
                EOF



            
                