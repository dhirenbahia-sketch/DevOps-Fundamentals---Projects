name: CI pipeline

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r cicd-assignment-1/requirements.txt
                pip install pytest flake8

            - name: Lint
              run: flake8 ./cicd-assignment-1 --max-line-length=100

            - name: Run tests
              run: pytest ./cicd-assignment-1

            - name: Docker build check
              run: docker build -t myapp ./cicd-assignment-1

    deploy:
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to EC2
              env:
                EC2_HOST: ${{ secrets.EC2_HOST }}
                EC2_USER: ${{ secrets.EC2_USER }}
                EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

              
              run: |
                set -e

                echo "STEP 1: Creating SSH directory"
                mkdir -p "$HOME/.ssh"

                echo "STEP 2: Writing private key"
                printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key"
                chmod 600 "$HOME/.ssh/ec2_key"

                echo "STEP 3: Validating private key"
                if ! ssh-keygen -y -f "$HOME/.ssh/ec2_key" > /dev/null; then
                  echo "ERROR: GitHub Actions cannot read the private key"
                  exit 1
                fi

                echo "STEP 4: Testing network connection to EC2"
                if ! timeout 10 bash -c "</dev/tcp/$EC2_HOST/22" 2>/dev/null; then
                  echo "ERROR: Cannot reach EC2 on port 22"
                  exit 1
                fi

                echo "STEP 5: Retrieving EC2 host key"
                if ! ssh-keyscan -T 10 -H "$EC2_HOST" > "$HOME/.ssh/known_hosts"; then
                  echo "ERROR: ssh-keyscan could not retrieve the EC2 host key"
                  exit 1
                fi

                echo "STEP 6: Connecting to EC2"
                ssh -v -i "$HOME/.ssh/ec2_key" "$EC2_USER@$EC2_HOST" << 'EOF'
                  cd /home/ec2-user/DevOps-Fundamentals---Projects/cicd-assignment-1

                  git pull origin main

                  sudo docker build -t myapp .

                  sudo docker stop myapp || true
                  sudo docker rm myapp || true

                  sudo docker run -d --name myapp --restart unless-stopped -p 80:5002 myapp
                EOF



            
                