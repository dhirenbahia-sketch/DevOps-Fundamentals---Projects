name: CI pipeline

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r cicd-assignment-1/requirements.txt
                pip install pytest flake8

            - name: Lint
              run: flake8 ./cicd-assignment-1 --max-line-length=100

            - name: Run tests
              run: pytest ./cicd-assignment-1

            - name: Docker build check
              run: docker build -t myapp ./cicd-assignment-1


            
                